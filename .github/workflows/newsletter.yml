name: Daily Newsletter Automation

on:
  schedule:
    # 매일 아침 8시(한국 시간)에 자동 실행 (UTC 기준 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 필요할 때 버튼을 눌러 수동 실행도 가능하게 설정

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 불러오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 파이썬 환경 세팅하기
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 필요한 라이브러리 설치하기
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      # 4. digest.py 실행하기 (GitHub Secrets에 저장한 보안 정보 사용)
      - name: Run script
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
        run: python digest.py